<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#7c3aed" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>وصال | WISAL</title>
    <style>
      #loading-screen{position:fixed;inset:0;z-index:9999;background:#fff;color:#312e81;font-family:Tahoma,Arial,sans-serif;transition:opacity .18s ease;pointer-events:none}
      #loading-screen .shell-head{height:80px;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800}
      #loading-screen .shell{max-width:1100px;margin:0 auto;padding:32px 16px}
      #loading-screen .hero{height:clamp(160px,28vw,280px);border-radius:24px;background:#f1f5f9}
      #loading-screen .nav{width:min(360px,85%);height:52px;margin:-18px auto 32px;border-radius:16px;background:#e2e8f0}
      #loading-screen .cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
      #loading-screen .card{height:116px;border-radius:18px;background:#f1f5f9}
      #loading-screen .pulse{animation:wisal-pulse 1.4s ease-in-out infinite}
      @media(min-width:768px){#loading-screen .cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
      @media(prefers-reduced-motion:reduce){#loading-screen .pulse{animation:none}}
      @keyframes wisal-pulse{50%{opacity:.55}}
    </style>
  </head>
  <body>
    <script>
      // Clear a production WISAL service worker left on localhost before Vite
      // loads the development bundle. Production hosts are unaffected.
      if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
        const cleanupKey = 'wisal-dev-sw-cleanup-v1';
        if (sessionStorage.getItem(cleanupKey) !== '1' && 'serviceWorker' in navigator) {
          Promise.all([
            navigator.serviceWorker.getRegistrations(),
            caches.keys(),
          ]).then(async ([registrations, cacheNames]) => {
            const appCacheNames = cacheNames.filter(name => name.startsWith('wisal-'));
            if (registrations.length === 0 && appCacheNames.length === 0) return;
            sessionStorage.setItem(cleanupKey, '1');
            await Promise.all([
              ...registrations.map(registration => registration.unregister()),
              ...appCacheNames.map(name => caches.delete(name)),
            ]);
            location.reload();
          }).catch(() => undefined);
        }
      }
    </script>
    <div id="loading-screen" aria-label="جارٍ تشغيل وصال" role="status">
      <div class="shell-head">وصال</div>
      <div class="shell"><div class="hero pulse"></div><div class="nav pulse"></div><div class="cards"><div class="card pulse"></div><div class="card pulse"></div><div class="card pulse"></div><div class="card pulse"></div></div></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Cloudflare Web Analytics -->
    <script type="module" src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "668b77faae3f4820a01ea9f1d0a63b24"}'></script>
    <!-- End Cloudflare Web Analytics -->
  </body>
</html>
